name: Build Windows app

# Produces a single LogoShowcase.exe that teammates download and double-click —
# no Python, pip, or other installs needed on their machines.
#
# Run it from the GitHub "Actions" tab (Build Windows app → Run workflow), or
# push a tag like v1.0.0 to also attach the exe to a Release.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build single-file exe
        run: pyinstaller LogoShowcase.spec

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogoShowcase-windows
          path: dist/LogoShowcase.exe

      - name: Attach exe to release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LogoShowcase.exe
